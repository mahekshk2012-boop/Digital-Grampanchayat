<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Certificate Applications | Digital Grampanchayat</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'gov-navy': '#0b3b60',
            'gov-navy-dark': '#07253d',
            'gov-saffron': '#f37021',
            'gov-green': '#138808',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

  <div id="navbar-container"></div>

  <main class="flex-1 py-10 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto w-full">
    
    <!-- Title & Header Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4">
      <div>
        <div class="inline-flex items-center gap-2 bg-emerald-50 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full mb-1 border border-emerald-200">
          <i class="fa-solid fa-stamp"></i> Digital Certificates
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-gov-navy">Track Certificate Applications</h1>
        <p class="text-xs text-slate-500 mt-1">View official application progress, officer remarks, and download stamped certificates</p>
      </div>

      <div class="flex items-center gap-2">
        <a href="apply-certificate.html" class="px-4 py-2.5 rounded-xl bg-gov-navy hover:bg-gov-navy-dark text-white font-bold text-xs shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i>
          <span>Apply New Certificate</span>
        </a>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="relative w-full sm:w-80">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-search text-xs"></i>
        </span>
        <input type="text" id="cert-search-input" placeholder="Search by ID, name or certificate type..." class="w-full pl-9 pr-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-gov-navy" />
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <span class="text-xs font-semibold text-slate-500 shrink-0">Filter Status:</span>
        <select id="cert-filter-status" class="w-full sm:w-auto px-3 py-2 text-xs border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-gov-navy">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Under Review">Under Review</option>
          <option value="Approved">Approved</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>
    </div>

    <!-- Applications List Container -->
    <div id="certificates-cards-list" class="space-y-4">
      <!-- Injected dynamically -->
    </div>

  </main>

  <!-- Reusable Certificate View / Stamped Print Modal -->
  <div id="cert-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="p-6" id="printable-area">
        <!-- Content injected dynamically -->
      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between no-print">
        <button onclick="window.print()" class="px-4 py-2 rounded-lg bg-gov-navy text-white text-xs font-bold hover:bg-gov-navy-dark transition flex items-center gap-1.5">
          <i class="fa-solid fa-print"></i> Print Stamped Certificate
        </button>
        <button onclick="document.getElementById('cert-modal').classList.add('hidden')" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-700 text-xs font-semibold hover:bg-slate-300 transition">
          Close
        </button>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="js/lang.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let certificates = await window.db.getCertificates();
      const container = document.getElementById('certificates-cards-list');
      const searchInput = document.getElementById('cert-search-input');
      const filterSelect = document.getElementById('cert-filter-status');

      const renderCertificates = () => {
        const query = searchInput.value.toLowerCase().trim();
        const statusFilter = filterSelect.value;

        const filtered = certificates.filter(c => {
          const matchQuery = (c.certificateId && c.certificateId.toLowerCase().includes(query)) ||
                             (c.applicantName && c.applicantName.toLowerCase().includes(query)) ||
                             (c.certificateType && c.certificateType.toLowerCase().includes(query));
          const matchStatus = statusFilter === 'All' || c.status === statusFilter;
          return matchQuery && matchStatus;
        });

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="bg-white p-12 text-center rounded-2xl border border-slate-200">
              <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
              <h4 class="font-bold text-sm text-slate-700">No Applications Found</h4>
              <p class="text-xs text-slate-500 mt-1">Try altering search keywords or submit a new certificate application.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = filtered.map(c => {
          // Status workflow steps
          const isPending = c.status === 'Pending';
          const isReview = c.status === 'Under Review';
          const isApproved = c.status === 'Approved';
          const isRejected = c.status === 'Rejected';

          return `
            <div class="gov-card bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-5">
              
              <!-- Card Top Header -->
              <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-100 gap-2">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-mono font-bold text-sm text-gov-navy">${c.certificateId}</span>
                    <span class="badge-${c.status.toLowerCase().replace(' ', '')} text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">
                      ${c.status}
                    </span>
                  </div>
                  <h3 class="font-bold text-base text-slate-800 mt-1">${c.certificateType}</h3>
                </div>

                <div class="text-xs text-slate-500 sm:text-right">
                  <p>Applied Date: <strong>${new Date(c.createdAt).toLocaleDateString()}</strong></p>
                  <p class="text-[11px] text-slate-400">Jurisdiction: Gram Panchayat</p>
                </div>
              </div>

              <!-- Workflow Progress Stepper (Section 8) -->
              <div class="py-2">
                <p class="text-[11px] font-semibold text-slate-500 mb-3 uppercase tracking-wider">Application Review Lifecycle</p>
                <div class="flex items-center justify-between max-w-md mx-auto">
                  
                  <!-- Step 1: Submitted -->
                  <div class="stepper-step completed">
                    <div class="stepper-circle"><i class="fa-solid fa-check text-xs"></i></div>
                    <span class="text-[10px] font-semibold text-slate-700 mt-1">Submitted</span>
                  </div>

                  <!-- Step 2: Under Review -->
                  <div class="stepper-step ${isReview || isApproved ? 'completed' : (isPending ? 'active' : '')}">
                    <div class="stepper-circle">
                      ${isApproved || (isReview && !isPending) ? '<i class="fa-solid fa-check text-xs"></i>' : '2'}
                    </div>
                    <span class="text-[10px] font-semibold text-slate-700 mt-1">Under Review</span>
                  </div>

                  <!-- Step 3: Decision -->
                  <div class="stepper-step ${isApproved ? 'completed' : (isRejected ? 'active' : '')}">
                    <div class="stepper-circle">
                      ${isApproved ? '<i class="fa-solid fa-check text-xs"></i>' : (isRejected ? '<i class="fa-solid fa-xmark text-xs text-rose-600"></i>' : '3')}
                    </div>
                    <span class="text-[10px] font-semibold text-slate-700 mt-1">${isRejected ? 'Rejected' : 'Approved'}</span>
                  </div>

                </div>
              </div>

              <!-- Application Details Grid -->
              <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                <div>
                  <span class="text-slate-400 block text-[10px]">Applicant Name:</span>
                  <span class="font-bold text-slate-800">${c.applicantName}</span>
                </div>
                <div>
                  <span class="text-slate-400 block text-[10px]">Contact Mobile:</span>
                  <span class="font-bold text-slate-800">${c.mobile || 'N/A'}</span>
                </div>
                <div>
                  <span class="text-slate-400 block text-[10px]">Ward / Address:</span>
                  <span class="font-bold text-slate-800">${c.ward || 'Ward 1'} - ${c.address || ''}</span>
                </div>
              </div>

              <!-- Admin Remarks -->
              <div class="bg-amber-50/60 p-3 rounded-xl border border-amber-200/60 text-xs text-amber-900 flex items-start gap-2">
                <i class="fa-solid fa-user-shield text-amber-600 mt-0.5"></i>
                <div>
                  <strong class="font-bold">Official Scrutiny Remarks:</strong>
                  <p class="text-slate-700 mt-0.5">${c.adminRemarks || 'Document verification currently under process by Gram Sevak.'}</p>
                </div>
              </div>

              <!-- Actions -->
              <div class="pt-2 flex items-center justify-end gap-3">
                ${isApproved ? `
                  <button onclick="window.viewOfficialCertificate('${c.certificateId}')" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm transition flex items-center gap-1.5">
                    <i class="fa-solid fa-stamp"></i>
                    <span>Download Stamped Certificate</span>
                  </button>
                ` : `
                  <span class="text-xs text-slate-500 italic">Certificate will become downloadable once verified and approved.</span>
                `}
              </div>

            </div>
          `;
        }).join('');
      };

      renderCertificates();
      searchInput.addEventListener('input', renderCertificates);
      filterSelect.addEventListener('change', renderCertificates);
    });

    window.viewOfficialCertificate = async (certId) => {
      const cert = await window.db.getCertificateById(certId);
      if (!cert) return;

      const modalContent = document.getElementById('printable-area');
      modalContent.innerHTML = `
        <div class="border-4 border-double border-gov-navy p-6 sm:p-8 bg-white relative">
          <div class="text-center border-b-2 border-slate-300 pb-4 mb-6">
            <p class="text-xs font-bold text-amber-700 uppercase tracking-widest">Government of Maharashtra | Rural Development Dept.</p>
            <h2 class="text-xl sm:text-2xl font-extrabold text-gov-navy mt-1">GRAM PANCHAYAT OFFICE</h2>
            <p class="text-xs text-slate-500 font-medium">District Pune, Maharashtra - 412411</p>
            <div class="mt-2 inline-block bg-gov-navy text-white px-4 py-1 rounded text-xs font-bold uppercase tracking-wider">
              ${cert.certificateType.toUpperCase()}
            </div>
          </div>

          <div class="flex items-center justify-between text-xs text-slate-600 font-semibold mb-6">
            <span>Certificate No: <strong class="text-slate-900">${cert.certificateId}</strong></span>
            <span>Date of Issue: <strong class="text-slate-900">${cert.approvedDate || '2026-10-24'}</strong></span>
          </div>

          <div class="text-sm leading-relaxed text-slate-800 space-y-4 mb-8">
            <p>This is to officially certify that <strong>${cert.applicantName}</strong>, resident of <strong>${cert.address}</strong> (${cert.ward || 'Ward 1'}), is an authenticated permanent resident of this Gram Panchayat jurisdiction.</p>
            
            ${cert.incomeAmount ? `
              <p>As per the records and verification by the Talathi / Gram Sevak, the total annual household income of the applicant is certified to be <strong>₹${cert.incomeAmount}</strong> (Rupees Sixty-Five Thousand Only) from occupation: <strong>${cert.occupation || 'Agriculture'}</strong>.</p>
            ` : ''}

            ${cert.dob ? `
              <p>Date of Event / Birth recorded in Panchayat Register: <strong>${cert.dob}</strong>.</p>
            ` : ''}

            <p class="text-xs text-slate-500 italic">This digital certificate has been issued on the basis of verified administrative records and bears a digitally authenticated Gram Panchayat seal.</p>
          </div>

          <div class="grid grid-cols-2 gap-8 pt-6 border-t border-slate-200 items-end text-center">
            <div>
              <div class="w-24 h-24 border-2 border-emerald-600 rounded-full mx-auto flex flex-col items-center justify-center p-1 text-emerald-700 rotate-[-12deg] bg-emerald-50/50">
                <span class="text-[9px] font-bold">DIGITALLY APPROVED</span>
                <i class="fa-solid fa-stamp text-xl my-0.5"></i>
                <span class="text-[8px] font-semibold">GRAM PANCHAYAT</span>
              </div>
              <p class="text-[10px] text-slate-500 mt-2">Official Digital Seal</p>
            </div>

            <div class="space-y-1">
              <div class="h-10 flex items-center justify-center font-serif italic text-base text-gov-navy font-bold">
                Anand Kulkarni
              </div>
              <p class="text-xs font-bold text-slate-800">Gram Sevak / Development Officer</p>
              <p class="text-[10px] text-slate-500">Gram Panchayat Administrative Office</p>
            </div>
          </div>
        </div>
      `;

      document.getElementById('cert-modal').classList.remove('hidden');
    };
  </script>
</body>
</html>
