<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Registration | Digital Grampanchayat</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'gov-navy': '#0b3b60',
            'gov-navy-dark': '#07253d',
            'gov-saffron': '#f37021',
            'gov-green': '#138808',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

  <div id="navbar-container"></div>

  <main class="flex-1 py-12 px-4 sm:px-6 flex items-center justify-center">
    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      
      <!-- Top Saffron Header Bar -->
      <div class="bg-gov-navy px-6 py-6 text-white text-center relative border-b-4 border-gov-saffron">
        <div class="w-14 h-14 rounded-full bg-white text-gov-navy flex items-center justify-center mx-auto mb-3 shadow-md border-2 border-amber-400">
          <i class="fa-solid fa-address-card text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold tracking-tight">Citizen Registration</h2>
        <p class="text-xs text-amber-200 mt-1">Create your digital Gram Panchayat citizen account</p>
      </div>

      <div class="p-6 sm:p-8 space-y-5">
        
        <form id="register-form" class="space-y-4">
          
          <!-- Full Name -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">
              Full Name (नाव) <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-user text-xs"></i>
              </span>
              <input type="text" id="reg-name" placeholder="e.g. Anand Vitthal Kulkarni" class="w-full pl-9 pr-3 py-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gov-navy" required />
            </div>
          </div>

          <!-- Mobile & Ward Row -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">
                Mobile Number (मोबाईल) <span class="text-rose-500">*</span>
              </label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                  <i class="fa-solid fa-phone text-xs"></i>
                </span>
                <input type="tel" id="reg-mobile" placeholder="10-digit number" pattern="[0-9]{10}" maxlength="10" class="w-full pl-9 pr-3 py-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gov-navy" required />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">
                Ward / Prabhag (प्रभाग) <span class="text-rose-500">*</span>
              </label>
              <select id="reg-ward" class="w-full px-3 py-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gov-navy bg-white" required>
                <option value="Ward 1">Ward No. 1 (Shivaji Galli)</option>
                <option value="Ward 2">Ward No. 2 (Ambedkar Nagar)</option>
                <option value="Ward 3">Ward No. 3 (Mandir Galli)</option>
                <option value="Ward 4">Ward No. 4 (Primary School Area)</option>
                <option value="Ward 5">Ward No. 5 (Bazaar Road / Outskirts)</option>
              </select>
            </div>
          </div>

          <!-- Email Address -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">
              Email Address (ईमेल) <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-envelope text-xs"></i>
              </span>
              <input type="email" id="reg-email" placeholder="e.g. anand@gmail.com" class="w-full pl-9 pr-3 py-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gov-navy" required />
            </div>
          </div>

          <!-- Village Address -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">
              Residential Address (पत्ता) <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <span class="absolute top-2.5 left-3 pointer-events-none text-slate-400">
                <i class="fa-solid fa-map-marker-alt text-xs"></i>
              </span>
              <textarea id="reg-address" rows="2" placeholder="House No, Galli Name, Village Landmark" class="w-full pl-9 pr-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gov-navy" required></textarea>
            </div>
          </div>

          <!-- Password & Confirm Password -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">
                Password <span class="text-rose-500">*</span>
              </label>
              <input type="password" id="reg-password" minlength="6" placeholder="Min. 6 chars" class="w-full px-3 py-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gov-navy" required />
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">
                Confirm Password <span class="text-rose-500">*</span>
              </label>
              <input type="password" id="reg-confirm-password" minlength="6" placeholder="Repeat password" class="w-full px-3 py-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gov-navy" required />
            </div>
          </div>

          <!-- Password Strength Meter -->
          <div>
            <div class="flex items-center justify-between text-[11px] text-slate-500 mb-1">
              <span>Password Security:</span>
              <span id="strength-label" class="font-bold text-slate-600">Enter password</span>
            </div>
            <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
              <div id="strength-bar" class="h-full bg-rose-500 w-0 transition-all duration-300"></div>
            </div>
          </div>

          <!-- Terms Declaration -->
          <div class="flex items-start gap-2 pt-1">
            <input type="checkbox" id="reg-terms" required class="mt-0.5 rounded text-gov-navy focus:ring-gov-navy" />
            <label for="reg-terms" class="text-[11px] text-slate-600 leading-tight">
              I hereby declare that the personal details provided above are true and accurate to the best of my knowledge as a resident of this Gram Panchayat.
            </label>
          </div>

          <button type="submit" id="submit-reg-btn" class="w-full py-3 rounded-lg bg-gov-saffron hover:bg-amber-600 text-white font-bold text-xs uppercase tracking-wider shadow-md transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-user-plus"></i>
            <span>Register Citizen Account</span>
          </button>
        </form>

        <!-- Login Link -->
        <div class="text-center pt-3 border-t border-slate-200">
          <p class="text-xs text-slate-600">
            Already have an account? 
            <a href="login.html" class="font-bold text-gov-navy hover:underline ml-1">Sign In to Portal</a>
          </p>
        </div>

      </div>

    </div>
  </main>

  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="js/lang.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pwdInput = document.getElementById('reg-password');
      const confirmPwdInput = document.getElementById('reg-confirm-password');
      const strengthBar = document.getElementById('strength-bar');
      const strengthLabel = document.getElementById('strength-label');
      const form = document.getElementById('register-form');

      // Password strength calculation
      pwdInput.addEventListener('input', () => {
        const val = pwdInput.value;
        let score = 0;
        if (val.length >= 6) score += 25;
        if (val.length >= 8) score += 25;
        if (/[A-Z]/.test(val)) score += 25;
        if (/[0-9!@#$%^&*]/.test(val)) score += 25;

        strengthBar.style.width = `${score}%`;
        if (score <= 25) {
          strengthBar.className = 'h-full bg-rose-500 transition-all duration-300';
          strengthLabel.textContent = 'Weak';
          strengthLabel.className = 'font-bold text-rose-600';
        } else if (score <= 50) {
          strengthBar.className = 'h-full bg-amber-500 transition-all duration-300';
          strengthLabel.textContent = 'Moderate';
          strengthLabel.className = 'font-bold text-amber-600';
        } else if (score <= 75) {
          strengthBar.className = 'h-full bg-blue-500 transition-all duration-300';
          strengthLabel.textContent = 'Good';
          strengthLabel.className = 'font-bold text-blue-600';
        } else {
          strengthBar.className = 'h-full bg-emerald-500 transition-all duration-300';
          strengthLabel.textContent = 'Strong';
          strengthLabel.className = 'font-bold text-emerald-600';
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('reg-name').value.trim();
        const mobile = document.getElementById('reg-mobile').value.trim();
        const ward = document.getElementById('reg-ward').value;
        const email = document.getElementById('reg-email').value.trim();
        const address = document.getElementById('reg-address').value.trim();
        const password = pwdInput.value;
        const confirmPassword = confirmPwdInput.value;

        // Validation 1: Mobile check
        if (!/^[0-9]{10}$/.test(mobile)) {
          window.ui.showToast('Please enter a valid 10-digit mobile number.', 'warning');
          return;
        }

        // Validation 2: Password match
        if (password !== confirmPassword) {
          window.ui.showToast('Passwords do not match. Please re-enter.', 'error');
          return;
        }

        const btn = document.getElementById('submit-reg-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Creating Account...';

        const result = await window.auth.register({
          name,
          email,
          mobile,
          ward,
          address,
          password
        });

        if (result.success) {
          window.ui.showToast('Registration successful! Redirecting to Dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> Register Citizen Account';
          window.ui.showToast(result.message || 'Registration failed.', 'error');
        }
      });
    });
  </script>
</body>
</html>
