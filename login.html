<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen & Official Login | Digital Grampanchayat</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'gov-navy': '#0b3b60',
            'gov-navy-dark': '#07253d',
            'gov-saffron': '#f37021',
            'gov-green': '#138808',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

  <div id="navbar-container"></div>

  <main class="flex-1 py-12 px-4 sm:px-6 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      
      <!-- Top Saffron Header Bar -->
      <div class="bg-gov-navy px-6 py-6 text-white text-center relative border-b-4 border-gov-saffron">
        <div class="w-14 h-14 rounded-full bg-white text-gov-navy flex items-center justify-center mx-auto mb-3 shadow-md border-2 border-amber-400">
          <i class="fa-solid fa-user-lock text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold tracking-tight" data-i18n="navLogin">Citizen & Official Login</h2>
        <p class="text-xs text-amber-200 mt-1">Access Gram Panchayat Services & Portals</p>
      </div>

      <div class="p-6 sm:p-8 space-y-6">
        
        <!-- Quick Demo Switcher (Crucial for presentation & evaluators!) -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs">
          <div class="flex items-center gap-1.5 font-bold text-amber-900 mb-2">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-600"></i>
            <span>Mini Project Quick Demo Sign-in:</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="demo-citizen-btn" class="bg-white hover:bg-amber-100 text-slate-700 py-1.5 px-2 rounded-lg border border-amber-300 font-semibold text-center transition flex items-center justify-center gap-1">
              <i class="fa-solid fa-user text-gov-navy text-[10px]"></i> Citizen Demo
            </button>
            <button type="button" id="demo-admin-btn" class="bg-white hover:bg-amber-100 text-slate-700 py-1.5 px-2 rounded-lg border border-amber-300 font-semibold text-center transition flex items-center justify-center gap-1">
              <i class="fa-solid fa-shield-halved text-purple-700 text-[10px]"></i> Admin Demo
            </button>
          </div>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
          
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Registered Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-envelope text-xs"></i>
              </span>
              <input type="email" id="login-email" placeholder="e.g. citizen@grampanchayat.gov.in" class="w-full pl-9 pr-3 py-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gov-navy" required />
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-semibold text-slate-700">Password</label>
              <a href="#" onclick="alert('Password reset instructions will be sent to your registered email or mobile number.'); return false;" class="text-[11px] text-gov-navy hover:underline font-medium">Forgot Password?</a>
            </div>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-lock text-xs"></i>
              </span>
              <input type="password" id="login-password" placeholder="••••••••" class="w-full pl-9 pr-10 py-2.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gov-navy" required />
              <button type="button" id="toggle-pwd-btn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                <i class="fa-regular fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Role Indicator Info -->
          <div class="text-[11px] text-slate-500 flex items-center gap-1.5">
            <i class="fa-solid fa-info-circle text-gov-navy"></i>
            <span>Admins log in with official Gram Panchayat credentials.</span>
          </div>

          <button type="submit" id="submit-login-btn" class="w-full py-3 rounded-lg bg-gov-navy hover:bg-gov-navy-dark text-white font-bold text-xs uppercase tracking-wider shadow-md transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Sign In to Portal</span>
          </button>
        </form>

        <!-- Register Link -->
        <div class="text-center pt-4 border-t border-slate-200">
          <p class="text-xs text-slate-600">
            Don't have an account yet? 
            <a href="register.html" class="font-bold text-gov-saffron hover:underline ml-1">Create Citizen Account</a>
          </p>
        </div>

      </div>

    </div>
  </main>

  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="js/lang.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const form = document.getElementById('login-form');
      const togglePwd = document.getElementById('toggle-pwd-btn');

      // Toggle password visibility
      togglePwd.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePwd.innerHTML = type === 'password' ? '<i class="fa-regular fa-eye text-xs"></i>' : '<i class="fa-regular fa-eye-slash text-xs"></i>';
      });

      // Quick Demo Fillers
      document.getElementById('demo-citizen-btn').addEventListener('click', () => {
        emailInput.value = 'citizen@grampanchayat.gov.in';
        passwordInput.value = 'Citizen@123';
        window.ui.showToast('Citizen Demo credentials populated!', 'info');
      });

      document.getElementById('demo-admin-btn').addEventListener('click', () => {
        emailInput.value = 'admin@grampanchayat.gov.in';
        passwordInput.value = 'Admin@Panchayat2026';
        window.ui.showToast('Admin Demo credentials populated!', 'info');
      });

      // Handle Submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value;
        const password = passwordInput.value;

        const submitBtn = document.getElementById('submit-login-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verifying...';

        const result = await window.auth.login(email, password);

        if (result.success) {
          window.ui.showToast(`Welcome back, ${result.user.name}!`, 'success');
          setTimeout(() => {
            if (result.user.role === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          }, 600);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> Sign In to Portal';
          window.ui.showToast(result.message || 'Login failed. Please check credentials.', 'error');
        }
      });
    });
  </script>
</body>
</html>
